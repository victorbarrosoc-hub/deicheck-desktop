<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>DEICHECK · sem conexão</title>
<style>
html,body{height:100%;margin:0}
body{background:#050605;color:#f1f5ea;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;text-align:center}
main{max-width:420px;padding:32px;display:flex;flex-direction:column;gap:16px;align-items:center}
h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.02em}
p{margin:0;color:#b9c2ad}
button{font:inherit;font-weight:600;color:#0a0d06;background:#c8ef7a;border:0;border-radius:999px;height:48px;padding:0 28px;cursor:pointer}
button:focus-visible{outline:2px solid #f1f5ea;outline-offset:3px}
small{color:#869078}
</style></head>
<body><main>
<h1>Sem conexão</h1>
<p>O DEICHECK precisa de internet para mostrar o evento ao vivo.</p>
<button type="button" id="de-novo">Tentar de novo</button>
<small id="st"></small>
</main>
<script>
const INICIO='https://www.deicheck.com.br/vision', st=document.getElementById('st')
const ir=()=>{st.textContent='Tentando…';location.href=INICIO}
document.getElementById('de-novo').addEventListener('click',ir)
addEventListener('online',ir)
</script></body></html>
